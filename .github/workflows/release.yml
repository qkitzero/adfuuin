name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - run: |
          VERSION=${GITHUB_REF_NAME}
          cd dist
          zip -r "../adfuuin-${VERSION}.zip" .

      - uses: softprops/action-gh-release@v3
        with:
          files: adfuuin-${{ github.ref_name }}.zip
          generate_release_notes: true
